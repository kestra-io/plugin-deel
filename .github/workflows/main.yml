name: Main

on:
  schedule:
    - cron: '0 4 * * 1,2,3,4,5'
  push:
    branches:
      - main
      - releases/*
    tags:
      - v*

  pull_request:
    branches:
      - main
      - releases/*

  workflow_dispatch:
    inputs:
      skip-test:
        description: 'Skip test'
        type: choice
        required: true
        default: 'false'
        options:
          - "true"
          - "false"
      kestra-version:
        description: 'Kestra version'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  checks: write
  actions: read
  pull-requests: write
  packages: read

jobs:
  check:
    uses: kestra-io/actions/.github/workflows/plugins.yml@main
    with:
      skip-test: ${{ github.event.inputs.skip-test == 'true' }}
      kestra-version: ${{ github.event.inputs.kestra-version }}
      java-version: '21'
    secrets: inherit

  test-kestra-2:
    name: Test / Kestra 2.0
    if: ${{ github.event.inputs.skip-test != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      # The plugin is built against Kestra 1.3 / Java 21; run the suite against 2.x too so both stay supported
      - name: Test against Kestra 2.0
        run: ./gradlew test -PkestraVersion=2.0.4 -PtargetJavaVersion=25 --no-daemon --console=plain
